<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Packing List — KoreaGang 2026</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .pk-hero {
      padding: 120px 0 48px;
      border-bottom: 1px solid var(--ink);
    }
    .pk-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .pk-eyebrow::before {
      content: ""; width: 36px; height: 1px; background: var(--ink); display: block;
    }
    .pk-title {
      font-family: var(--serif);
      font-size: clamp(52px, 11vw, 140px);
      line-height: 0.9;
      letter-spacing: -0.04em;
      font-weight: 400;
      margin: 0;
    }
    .pk-title em { font-style: italic; color: var(--dc-red); }
    .pk-sub {
      margin-top: 22px;
      font-size: 14px;
      color: var(--ink-soft);
      max-width: 460px;
      line-height: 1.6;
    }
    .pk-note {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0.7;
    }

    /* Grid */
    .pk-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      margin-top: 56px;
      border-left: 1px solid var(--line);
    }
    @media (max-width: 860px) {
      .pk-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .pk-grid { grid-template-columns: 1fr; }
    }

    .pk-col {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .pk-progress {
      height: 3px;
      background: var(--line);
      overflow: hidden;
    }
    .pk-progress-fill {
      height: 100%;
      background: var(--dc-green);
      transition: width .4s var(--ease);
    }

    .pk-col-head {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--ink);
      background: var(--paper);
      position: sticky;
      top: 60px;
      z-index: 5;
    }
    .pk-col-name {
      font-family: var(--serif);
      font-size: 28px;
      font-style: italic;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .pk-col-count {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-top: 4px;
    }
    .pk-col-count span { color: var(--dc-red); font-weight: 700; }

    .pk-items { list-style: none; padding: 0; }

    .pk-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background .18s;
      -webkit-tap-highlight-color: transparent;
      min-height: 64px;
      user-select: none;
    }
    .pk-item:last-child { border-bottom: none; }
    .pk-item:hover { background: var(--paper-2); }
    .pk-item:active { background: var(--paper-2); }

    .pk-check {
      width: 22px; height: 22px;
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .18s, border-color .18s;
      pointer-events: none;
    }
    .pk-item.done .pk-check {
      background: var(--dc-green);
      border-color: var(--dc-green);
    }
    .pk-check-mark { display: none; color: white; font-size: 13px; line-height: 1; }
    .pk-item.done .pk-check-mark { display: block; }

    .pk-item-text {
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.3;
      color: var(--ink);
      pointer-events: none;
      flex: 1;
    }
    .pk-item.done .pk-item-text {
      color: var(--ink-soft);
      text-decoration: line-through;
      text-decoration-color: var(--dc-green);
    }
    .pk-item-sub {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-top: 3px;
    }

    .pk-footer-note {
      margin-top: 48px;
      padding: 20px 0;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <section class="pk-hero">
    <div class="wrap">
      <div class="pk-eyebrow">§ 01 — Packing List</div>
      <h1 class="pk-title">Don't<br><em>forget.</em></h1>
      <p class="pk-sub">One checklist per person — same four items. Anyone can check on any device.</p>
      <p class="pk-note">Synced to the server — checks visible to everyone.</p>
    </div>
  </section>

  <section class="wrap">
    <div class="pk-grid" id="pk-grid"></div>
    <div class="pk-footer-note">Check state is synced to the server — visible to everyone on any device.</div>
  </section>

  <footer class="kg-footer">
    <div class="wrap">
      <div class="kg-footer-row">
        <div><div class="kg-footer-mark">KoreaGang</div></div>
        <a href="_index.html">← Calendar</a>
      </div>
    </div>
  </footer>

  <script src="common.js?v=2"></script>  <script>
    const PEOPLE_PK = ['Ada', 'Saimi', 'Jere', 'Alexsis'];

    const ITEMS = [
      { text: 'Passport',          sub: 'Check expiry — valid 6 months+' },
      { text: 'Flight tickets',    sub: 'Downloaded / screenshot' },
      { text: 'Travel insurance',  sub: 'Docs saved offline' },
      { text: 'Swimming clothes',   sub: 'For spa / water park days' },
    ];

    function stateKey(person, idx) { return person + '_' + idx; }

    let _state = {};

    async function loadState() {
      try {
        _state = (await apiGet('/api/packing')) || {};
      } catch(_) { _state = {}; }
      return _state;
    }

    async function setKey(k, val) {
      _state[k] = val;
      try { await apiPost('/api/packing', { key: k, value: val }); } catch(_) {}
    }

    async function toggle(person, idx) {
      const k = stateKey(person, idx);
      const newVal = !_state[k];
      await setKey(k, newVal);
      renderCol(person);
    }

    function renderCol(person) {
      const s = _state;
      const col = document.getElementById('pkcol-' + person);
      if (!col) return;
      const doneCount = ITEMS.filter((_, i) => !!s[stateKey(person, i)]).length;
      const pct = Math.round((doneCount / ITEMS.length) * 100);
      const fill = col.querySelector('.pk-progress-fill');
      if (fill) fill.style.width = pct + '%';
      const cnt = col.querySelector('.pk-col-count span');
      if (cnt) cnt.textContent = doneCount + '/' + ITEMS.length;
      ITEMS.forEach((_, i) => {
        const el = col.querySelector('[data-idx="' + i + '"]');
        if (!el) return;
        el.classList.toggle('done', !!s[stateKey(person, i)]);
      });
    }

    async function buildGrid() {
      await loadState();
      const grid = document.getElementById('pk-grid');
      grid.innerHTML = PEOPLE_PK.map(person => `
        <div class="pk-col" id="pkcol-${person}">
          <div class="pk-progress"><div class="pk-progress-fill" style="width:0%"></div></div>
          <div class="pk-col-head">
            <div class="pk-col-name">${person}</div>
            <div class="pk-col-count"><span>0</span>/${ITEMS.length} done</div>
          </div>
          <ul class="pk-items">
            ${ITEMS.map((item, i) => `
              <li class="pk-item" data-person="${person}" data-idx="${i}" onclick="toggle('${person}', ${i})">
                <div class="pk-check"><span class="pk-check-mark">✓</span></div>
                <div class="pk-item-text">${item.text}<span class="pk-item-sub">${item.sub}</span></div>
              </li>`).join('')}
          </ul>
        </div>`).join('');
      PEOPLE_PK.forEach(renderCol);
    }

    ready(() => {
      initCursor();
      injectNav('packing');
      buildGrid();
    });
  </script>
</body>
</html>
